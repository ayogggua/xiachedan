# IP 证书使用独立 Certbot 目录；改用域名时同步修改来源白名单和客户端构建变量。
server {
    listen 80;
    listen [::]:80;
    server_name 117.50.187.95;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # IP 客户端可能不发送 SNI，默认 TLS 站点需使用 IP 证书；其他域名仍按 SNI 匹配。
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 117.50.187.95;
    ssl_certificate /etc/xiachedan/acme/live/xiachedan-ip/fullchain.pem;
    ssl_certificate_key /etc/xiachedan/acme/live/xiachedan-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/xiachedan/frontend/current;
    index index.html;
    client_max_body_size 101m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location = /socket {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
    location /assets/ {
        try_files $uri =404;
        # 资源文件带内容哈希，不缓存 HTML。
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
