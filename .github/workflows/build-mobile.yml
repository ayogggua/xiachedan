name: Build Android

on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths: ['src/**', 'shared/**', 'public/**', 'mobile/android/**', 'capacitor.config.json', 'index.html', 'vite.config.js', 'scripts/pwa.mjs', 'scripts/build-mobile.mjs', 'package.json', 'package-lock.json', '.github/workflows/build-mobile.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布安卓体验包（仅 main 可选，不占用桌面 Latest）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Package Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      VITE_API_BASE_URL: ${{ vars.CHAT_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Select mobile version
        id: version
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = readFileSync('mobile/android/app/build.gradle', 'utf8').match(/versionName\s+"([0-9]+\.[0-9]+\.[0-9]+)"/)?.[1];
          if (!version) throw new Error('Missing mobile version');
          const tag = `mobile-v${version}`, ref = process.env.GITHUB_REF;
          const tagged = ref.startsWith('refs/tags/');
          const publish = tagged || process.env.PUBLISH_RELEASE === 'true';
          if (tagged && ref !== `refs/tags/${tag}`) throw new Error('Tag does not match Android version');
          if (publish) {
            if (!tagged && ref !== 'refs/heads/main') throw new Error('Publish from main only');
            execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main']);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\npublish=${publish}\n`);
          JS
      - name: Validate production client address
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        run: node -e 'const value=process.env.VITE_API_BASE_URL; const url=new URL(value); if(url.protocol!=="https:" || url.origin!==value || /^[0-9.]+$/.test(url.hostname) || url.hostname.includes(":")) throw new Error("Set CHAT_PUBLIC_URL to the production HTTPS domain");'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Restore internal signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          PUBLISH_RELEASE: ${{ steps.version.outputs.publish }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { homedir } from 'node:os';
          import path from 'node:path';
          const value = process.env.ANDROID_DEBUG_KEYSTORE;
          if (!value && process.env.PUBLISH_RELEASE === 'true') throw new Error('Configure ANDROID_DEBUG_KEYSTORE for consistent internal app updates');
          if (value) {
            const directory = path.join(homedir(), '.android');
            mkdirSync(directory, { recursive: true, mode: 0o700 });
            writeFileSync(path.join(directory, 'debug.keystore'), Buffer.from(value, 'base64'), { mode: 0o600 });
          }
          JS
      - run: npm ci
      - run: npm run package:android
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify release/*.apk'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: xiachedan-android
          path: release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

  release:
    name: Publish Android internal release
    needs: android
    if: needs.android.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: xiachedan-android
          path: release
      - name: Publish separately from desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.android.outputs.tag }}
          MOBILE_VERSION: ${{ needs.android.outputs.version }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Android $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Mobile release already exists; keeping existing APK.'
            exit 0
          fi
          printf '%s\n' '安卓内部体验包，包含移动聊天界面和配置化 HTTPS 服务入口。' '此版本使用开发签名，不用于应用商店发布。iPhone 请使用部署后的 PWA。' > "$RUNNER_TEMP/android-notes.txt"
          gh release create "$RELEASE_TAG" release/*.apk --verify-tag --title "虾扯蛋安卓体验版 $MOBILE_VERSION" --notes-file "$RUNNER_TEMP/android-notes.txt" --prerelease --latest=false
