name: Deploy backend
on:
  push:
    branches: [main]
    paths: ['server/**', 'package.json', 'package-lock.json', 'deploy/Dockerfile.backend', 'deploy/compose.yml', '.dockerignore', '.github/workflows/deploy-backend.yml']
  pull_request:
    branches: [main]
    paths: ['server/**', 'package.json', 'package-lock.json', 'deploy/**', '.dockerignore', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Check backend
        run: |
          for file in server/*.js; do node --check "$file"; done
          bash -n deploy/release.sh deploy/ssh-entry.sh
          npm audit --omit=dev --audit-level=high
      - name: Build independent backend image
        run: docker build -f deploy/Dockerfile.backend -t "xiachedan-backend:$GITHUB_SHA" .
      - name: Deploy backend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '117.50.187.95' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          mkdir -p bundle
          docker save "xiachedan-backend:$GITHUB_SHA" | gzip -1 > bundle/image.tar.gz
          cp deploy/compose.yml bundle/
          tar -czf backend.tar.gz -C bundle .
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "backend $GITHUB_SHA" < backend.tar.gz
